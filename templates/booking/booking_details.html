{% extends "base.html" %}
{% block content %}
<div class="wrapper_login">
    <div class="login_container infa_container">

        <div class="card">
            <div class="card-body">
                <h1 class="card-title">Booking: {{booking.id}}</h1>
                <div class="mb-3"><h2><strong>User:</strong> {{booking.user}}</h2></div>
                <div class="mb-3"><h2><strong>Room:</strong> {{booking.room}}</h2></div>
                <div class="mb-3"><h2><strong>Time range:</strong> {{booking.start_time}} - {{booking.end_time}}</h2></div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'index' %}" class="btn form-submit-button btn-lg">Back to home page</a>
        </div>
    </div>
</div>

{% endblock %}
