{%extends "base.html"%}
{% block content %}
<table class="table table-striped table-hover mb-0">
    <thead class="bg-primary text-white">
        <tr>
            <th>Room</th>
            <th>Capacity</th>
            <th>Location</th>
        </tr>
    </thead>
    <tbody>
        {% for room in rooms %}
        <tr>
            <td>{{ room.number }}</td>
            <td>{{ room.capacity }}</td>
            <td>{{ room.locations }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<div class="text-center mt-4">
    <a href="{% url 'index'%}" class="btn btn-primary mb-3">Go to home page</a>
    <br>
    <a href="{% url 'book_room'%}" class="btn btn-primary ">Go to rooms booking</a>
</div>

{% endblock %}
